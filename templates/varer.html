{% extends "base.html" %}

{% block title %}
Varer
{% endblock %}

{% block content %}
<h2>Varer</h2>
<div class="varer">
{% for kategori, liste in varer.items() %}
    <h3>{{ kategori }}</h3>
    {% for ting in liste %}
    <img src={{ting.bilde}} alt={{ting.navn}}>
    <h3>{{ting.navn}}</h3>
    <p>{{ ting.pris }} kr</p>
    {% endfor %}
{% endfor %}
</div>
{% endblock %}
